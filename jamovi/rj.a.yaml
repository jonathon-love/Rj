---
name:  Rj
title: Rj Editor
menuGroup: R
menuSubgroup: Rj
version: '1.0.0'
jas: '1.2'
arbitraryCode: true

options:
    - name: data
      type: Data

    - name: code
      default: |

        # summary(data[1:3])

      type: String
      hidden: true

    - name: editorState
      type: Group
      hidden: true
      passive: true
      elements:
        - name: draft
          type: String
          default: ''
        - name: hasDraft
          type: Bool
          default: false
        - name: filename
          type: String
          default: ''
        - name: baseline
          type: String
          default: ''
        - name: serviceCode
          type: String
          default: ''
        - name: serviceName
          type: String
          default: ''

    - name: saveEditorScript
      type: Action
      hidden: true
      action: openExternal

    - name: editorCleared
      type: Bool
      hidden: true
      default: false

    - name: omvFile
      type: File
      title: OMV input
      extensions: [omv]

    - name: saveOmvFile
      type: Action
      hidden: true
      action: openExternal

    - name: previewDataext
      type: Bool
      hidden: true
      default: false

    - name: previewDataextRequest
      type: Bool
      hidden: true
      default: false

    - name: dataextInfo
      type: Group
      hidden: true
      elements:
        - name: json
          type: String
          default: '{}'

    - name: R
      title: R version
      type: List
      hidden: true
      options:
        - name: bundled
          title: jamovi R
        - name: external
          title: System R
      default: bundled

    - name: vars
      type: Variables
      hidden: true
      permitted:
        - factor
        - numeric
        - id

    - name: output
      type: List
      hidden: true
      options:
        - noEcho
        - echo
      default: noEcho

    - name: figWidth
      type: String
      default: ''
      hidden: true

    - name: figHeight
      type: String
      default: ''
      hidden: true

    - name: toggle
      type: Bool
      default: false
      hidden: true


    - name: graphicCapture
      type: String
      default: ''
      hidden: true

...
